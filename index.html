<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Data Diri</title>

    <!-- Font Awesome-->
     <link rel="stylesheet"
     href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

     <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sidebar">

    <h2><i> class="fa-solid fa-user"></i> Data Diri</h2>

    <ul>
        <li class="active"><a href="#"><i class="fa-solid fa-house"></i> Dashboard</a></li>

        <li><a href="#"><i class="fa-solid fa-id-card"></i> Profil</a></li>

        <li><a href="#"><i class="fa-solid fa-address-book"></i> Biodata</a></li>

        <li><a href="#"><i class="fa-solid fa-gear"></i> Pengaturan</a></li>

        <li><a href="#"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>
    </ul>

</div>

<div class="main">

    <div class="navbar">

        <h2>Dashboard Data Diri</h2>

        <div class="user">

            <span>Nadzira</span>

            <img src="https://via.placeholder.com/50">

       </div>

    </div>

    </div class="cards">

        <div class="card">
            <i class="fa-solid fa-user"></i>
            <h3>1</h3>
            <p>Profil</p>
        </div>

        <div class="card">
            <i class="fa-solid fa-envelope"></i>
            <h3>1</h3>
            <p>Email</p>
        </div>

        <div class="card">
            <i class="fa-solid fa-phone"></i>
            <h3>1</h3>
            <p>Kontak</p>
        </div>

        <div class="card">
            <i class="fa-solid fa-location-dot"></i>
            <h3>1</h3>
            <p>Alamat</p>
        </div>

    </div>

    <div class="content">

        <div class="form">

             <h2>Form Data Diri</h2>

             <input type="text" placeholder="Nama Lengkap">
             <input type="text" placeholder="NIM">

             <input type="text" placeholder="Kelas">

             <input type="email" placeholder="Email">

             <input type="text" placeholder="Nomor HP">

             <textarea placeholder="Alamat"></textarea>

             <button class="btn-save">Simpan</button>

             <button class="btn-save">Reset</button>

        </div>

        <div class="table">

            <h2>Data Siswa</h2>

            <table>

                <tr>

                    <th>Nama</th>

                    <th>NIM</th>

                    <th>Kelas</th>

                    <th>Email</th>

                </tr>

                <tr>

                    <td>Nadzira Athira</td>

                    <td>1234567890</td>

                    <td>XI RPL 2</td>

                    <td>nadziraathira.2601@gmail.com</td>

                </tr>

            </table>

        </div>

    </div>

</div>

</body>
</html>
